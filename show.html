<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="/images/logo.png" />
        <link rel="shortcut icon" type="image/x-icon" href="/images/per.ico" />
        <title>契約成立</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style>
            html,
            body {
                height: 100vh;
                overflow: hidden;
                margin: 0;
                padding: 0;
            }
            body {
                background-color: #e8e8e8;
                display: flex;
                flex-direction: column;
            }
            img {
                max-width: 126px;
            }
            nav {
                margin-top: 4px;
                background-color: #f5f5f7ae;
                flex-shrink: 0;
                font-size: 12px; 
                .menu {
                    a:not(:first-child)::before {
                        content: "|";
                        color: #65347f; /* purple */
                    }
                    a::before {
                        margin-right: 2.95rem;
                    }
                }
            }
            .bg-black {
                width: 100%;
                height: 6px;
                background-color: #65347f;
                position: fixed;
                top: 0;
            }
            .main-content {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        </style>
    </head>
    <body>
        <div class="bg-black"></div>
        <nav class="flex justify-center items-center p-2 shadow-xs">
            <div class="menu flex space-x-6">
                <a href="/" class="text-gray-500 hover:text-blue-600 transition-colors duration-200 px-4">關於我們</a>
                <a href="/" class="text-gray-500 hover:text-blue-600 transition-colors duration-200 px-4">使用說明</a>
                <a href="/" class="text-gray-500 hover:text-blue-600 transition-colors duration-200 px-4">支援服務</a>
                <a href="/" class="text-gray-500 hover:text-blue-600 transition-colors duration-200 px-4">馬上訂閱</a>
            </div>
        </nav>
        <div class="main-content">
            <img src="/images/logo.png" />
        </div>
    </body>
</html>
